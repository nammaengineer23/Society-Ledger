name: Build Signed Testing AAB

on:
  push:
    branches:
      - main
      - build/testing-aab
    paths:
      - ".github/workflows/build-testing-aab.yml"
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradlew"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-testing-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aab:
    name: Test and build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing STORE_PASSWORD repository secret."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD repository secret."; exit 1; }

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/society-ledger-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify AAB exists
        id: locate
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB" || { echo "::error::Expected signed AAB was not generated at $AAB"; exit 1; }
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"
          ls -lh "$AAB"

      - name: Upload AAB for manual Play Console upload
        uses: actions/upload-artifact@v4
        with:
          name: society-ledger-testing-aab
          path: ${{ steps.locate.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30
