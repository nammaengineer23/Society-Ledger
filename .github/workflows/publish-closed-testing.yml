name: Publish to Google Play Closed Testing

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track (internal, alpha, beta, closed, production)'
        required: true
        default: 'closed'
        type: choice
        options:
          - closed
          - internal
          - alpha
          - beta
      release_status:
        description: 'Release rollout status (completed, draft, inProgress, halted)'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
      user_fraction:
        description: 'User rollout fraction for inProgress releases (e.g. 0.1 for 10%, 1.0 for 100%)'
        required: false
        default: '1.0'
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build AAB & Publish to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Run Pre-Release Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Decode Release Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not defined in GitHub repository secrets."
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/release-upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "keystore_path=$KEYSTORE_PATH" >> $GITHUB_OUTPUT

      - name: Build Release Android App Bundle (AAB)
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Locate Generated Release AAB
        id: find_aab
        run: |
          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "::error::No release .aab found under app/build/outputs/bundle/release/"
            exit 1
          fi
          echo "Found AAB at: $AAB_FILE"
          echo "aab_path=$AAB_FILE" >> $GITHUB_OUTPUT

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: society-ledger-release-aab
          path: ${{ steps.find_aab.outputs.aab_path }}
          retention-days: 30

      - name: Publish to Google Play Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.societyledger.app
          releaseFiles: ${{ steps.find_aab.outputs.aab_path }}
          track: ${{ github.event.inputs.track || 'closed' }}
          status: ${{ github.event.inputs.release_status || 'completed' }}
          userFraction: ${{ github.event.inputs.user_fraction || '1.0' }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt
